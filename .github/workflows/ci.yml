# tes3cmd-rs: formatting, Clippy and the tests on Windows, Linux and macOS, and on Linux the
# port run beside tes3cmd's own Perl (tests/tes3cmd/tes3cmd.pl), every output compared.
# The built program is kept from each system.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Release build
        run: cargo build --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tes3cmd-${{ runner.os }}
          path: |
            target/release/tes3cmd
            target/release/tes3cmd.exe
          if-no-files-found: error

  against-perl:
    # Every case of tests/vs_perl.rs run by both tes3cmd and the port, outputs and files
    # compared byte for byte; in two time zones (resetdates prints local time).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch
        with:
          toolchain: stable
      - name: The reference script is the released one
        run: echo "5b59ac399a9bd9aba97665de40e7f14669e839120055baeda2faa14a3595ca57  tests/tes3cmd/tes3cmd.pl" | sha256sum -c -
      - name: Against tes3cmd (UTC)
        env:
          TES3CMD_PL: ${{ github.workspace }}/tests/tes3cmd/tes3cmd.pl
          TZ: UTC
        run: cargo test --test vs_perl
      - name: Against tes3cmd (America/New_York)
        env:
          TES3CMD_PL: ${{ github.workspace }}/tests/tes3cmd/tes3cmd.pl
          TZ: America/New_York
        run: cargo test --test vs_perl
